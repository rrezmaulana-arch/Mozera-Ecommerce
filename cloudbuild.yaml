steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/mozera:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/mozera:latest'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/mozera:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/mozera:latest']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'mozera'
      - '--image=gcr.io/$PROJECT_ID/mozera:$COMMIT_SHA'
      - '--region=asia-southeast2'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--set-env-vars=APP_ENV=production,APP_DEBUG=false,LOG_CHANNEL=stderr,SESSION_DRIVER=cookie,CACHE_STORE=file,DB_CONNECTION=sqlite,DB_DATABASE=/var/www/html/database/database.sqlite,MIDTRANS_SERVER_KEY=SB-Mid-server-eo.sjNayLVRo2KybEvLn04Ak,MIDTRANS_CLIENT_KEY=Mid-client-BCH8_jCEDMoRbr2a,MIDTRANS_IS_PRODUCTION=false'

images:
  - 'gcr.io/$PROJECT_ID/mozera:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/mozera:latest'

options:
  logging: CLOUD_LOGGING_ONLY
